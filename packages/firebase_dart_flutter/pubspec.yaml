name: firebase_dart_flutter
description: A port of the Firebase database, auth and storage client to pure Dart code for use on flutter
version: 1.3.2
homepage: https://github.com/appsup-dart/firebase_dart

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_dart: ^1.5.0
  platform_info: ^5.0.0
  path_provider: ^2.0.0
  hive: ^2.0.0
  package_info_plus: '>=8.0.0 <10.0.0'
  url_launcher: ^6.0.0
  logging: ^1.0.2
  flutter_apns_only: ^1.0.0
  crypto: ^3.0.3
  app_links: ^6.3.3
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  plugin:
    platforms:
      android:
        package: be.appsup.firebase_dart_flutter
        pluginClass: FirebaseDartFlutterPlugin
