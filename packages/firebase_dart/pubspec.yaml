name: firebase_dart
description: A port of the Firebase database, auth and storage client to pure Dart code, usable on different platforms
version: 1.4.3
homepage: https://github.com/appsup-dart/firebase_dart

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  quiver: ^3.2.2
  async: ^2.13.0
  logging: ^1.3.0
  sortedmap: ^0.5.4
  web_socket_channel: ^3.0.3
  stream_channel: ^2.1.4
  collection: ^1.19.1
  meta: ^1.16.0
  jose: ^0.3.4
  clock: ^1.1.2
  firebaseapis: ^0.2.0
  openid_client: ^0.4.9
  hive: ^2.2.3
  rxdart: ^0.28.0
  http: ^1.4.0
  _discoveryapis_commons: ^1.0.7
  expressions: ^0.2.5+2
  uuid: ^4.5.1
  crypto: ^3.0.6
  js: ^0.7.2
  synchronized: ^3.4.0
  intl: ^0.20.2

dev_dependencies:
  test: ^1.26.3
  fake_async: ^1.3.3
  benchmark_harness: ^2.3.1
  vm_service: ^15.0.2
  lints: ^6.0.0

false_secrets:
 - /lib/src/core/options.dart
